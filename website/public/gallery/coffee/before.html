<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halden Roasters (default agent output)</title>
<style>
    :root { --violet: #7c3aed; --blue: #3b82f6; }
  body { margin: 0; font-family: Inter, sans-serif; color: #1e293b; background: #f8fafc; }
  .hero { min-height: 640px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 48px 24px; background: linear-gradient(135deg, var(--violet) 0%, var(--blue) 100%); color: #fff; }
  .badge { background: rgba(255,255,255,.2); padding: 6px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
  h1 { font-size: 64px; line-height: 1.1; max-width: 14ch; margin: 24px 0 16px; font-weight: 700; }
  .sub { max-width: 52ch; font-size: 19px; opacity: .85; margin: 0 0 32px; }
  .row { display: flex; gap: 16px; }
  .btn { padding: 14px 28px; border-radius: 16px; font-weight: 600; font-size: 16px; border: 0; cursor: pointer; }
  .btn.primary { background: #fff; color: #6d28d9; box-shadow: 0 10px 25px rgba(0,0,0,.25); }
  .btn:focus { outline: none; }
  .btn.ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.6); }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; padding: 48px; max-width: 1100px; margin: 0 auto; }
  .card { background: #fff; border-radius: 24px; padding: 28px; box-shadow: 0 10px 25px rgba(0,0,0,.12); transition: all .3s; }
  .card h3 { margin: 0 0 8px; font-size: 20px; }
  .card p { margin: 0; color: #64748b; line-height: 1.5; }
</style>
</head>
<body>
  <section class="hero">
    <span class="badge" data-slop="purple-blue-gradient">New · AI-powered</span>
    <h1 data-slop="generic-copy">Elevate your coffee experience seamlessly</h1>
    <p class="sub">Unlock revolutionary flavor with our cutting-edge roasting platform.</p>
    <div class="row" data-slop="centered-hero-two-ctas">
      <button class="btn primary" data-slop="outline-removed">Get started</button>
      <button class="btn ghost">Learn more</button>
    </div>
  </section>
  <section class="cards">
    <div class="card"><h3 data-slop="emoji-as-icon">☕ Fresh</h3><p>Roasted with care for the perfect cup every time.</p></div>
    <div class="card"><h3>✨ Premium</h3><p>Only the finest beans from around the world.</p></div>
    <div class="card"><h3>🚚 Fast</h3><p>Delivered right to your door, seamlessly.</p></div>
  </section>
</body>
</html>
