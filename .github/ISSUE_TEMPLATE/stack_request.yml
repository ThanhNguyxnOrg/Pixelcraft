name: New framework, stack, or library request
description: Propose adding or deepening idiomatic guidance for a UI framework, language, or specialized library
title: "[stack]: "
labels: ["enhancement"]
body:
  - type: input
    id: stack
    attributes:
      label: Framework, language, or library
      placeholder: "e.g., Rust GPUI, PHP Symfony UX, Go Ebitengine, C++ JUCE"
    validations:
      required: true
  - type: dropdown
    id: skill
    attributes:
      label: Owning Pixelcraft skill
      description: Pixelcraft extends existing surface/domain skills rather than adding parallel skill sprawl.
      options:
        - pixelcraft-web
        - pixelcraft-mobile
        - pixelcraft-desktop
        - pixelcraft-tui
        - pixelcraft-data-apps
        - pixelcraft-dataviz
        - pixelcraft-document
        - pixelcraft-email
        - pixelcraft-media
        - pixelcraft-chat-ui
        - pixelcraft-game-ui
        - pixelcraft-spatial
        - pixelcraft-constrained
        - pixelcraft-extensions
        - pixelcraft-tokens
    validations:
      required: true
  - type: textarea
    id: pitfalls
    attributes:
      label: Real idioms and failure modes agents get wrong
      description: What specific APIs, layout/a11y/theming traps, or lazy defaults do agents keep getting wrong on this stack?
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: Official documentation URLs
      placeholder: "https://..."
