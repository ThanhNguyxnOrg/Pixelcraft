name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/validate-skills.mjs
      - run: node bin/pixelcraft.mjs add all --agent all --dry-run
      - run: npm run test:distribution
      - name: Verify installer entry points
        run: npm run test:installers -- --shell --powershell
      - name: Verify adapters, tokens, and validator contracts
        run: npm run test:adapters && npm run test:tokens && npm run test:validator
      - run: npm run test:finish-gate && npm run test:slop-scan
      - name: Verify browser diagnostic fixtures
        env:
          PIXELCRAFT_TEST_PLAYWRIGHT_PROJECT: ${{ runner.temp }}/pixelcraft-qa
        run: |
          npm install --prefix "$PIXELCRAFT_TEST_PLAYWRIGHT_PROJECT" --no-package-lock --no-audit --no-fund playwright@1.65.1
          node "$PIXELCRAFT_TEST_PLAYWRIGHT_PROJECT/node_modules/playwright/cli.js" install --with-deps chromium
          npm run test:shoot && npm run test:style-inventory
