name: validate

on:
  push:
  pull_request:

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/validate-skills.mjs
      - run: node bin/pixelcraft.mjs add all --agent all --dry-run
      - run: npm run test:finish-gate && npm run test:slop-scan
      - name: Verify browser diagnostic fixtures
        env:
          PIXELCRAFT_TEST_PLAYWRIGHT_PROJECT: ${{ runner.temp }}/pixelcraft-qa
        run: |
          npm install --prefix "$PIXELCRAFT_TEST_PLAYWRIGHT_PROJECT" --no-package-lock --no-audit --no-fund playwright@1.65.1
          node "$PIXELCRAFT_TEST_PLAYWRIGHT_PROJECT/node_modules/playwright/cli.js" install --with-deps chromium
          npm run test:shoot
