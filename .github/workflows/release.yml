name: Package and Publish Pixelcraft

on:
  create:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixelcraft-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'ThanhNguyxnOrg/Pixelcraft' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/validate-skills.mjs
      - name: Verify release tag and npm package
        run: npm run test:distribution -- --release
      - name: Package skills and adapters
        run: node scripts/build-release-archives.mjs dist/release
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets-pixelcraft
          path: dist/release/
          if-no-files-found: error

  assets:
    needs: package
    permissions:
      actions: read
      contents: read
    uses: ThanhNguyxnOrg/.github/.github/workflows/release-publish.yml@release-v1
    with:
      tag: ${{ github.ref_name }}
    secrets:
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}

  npm:
    needs: assets
    permissions:
      contents: read
      id-token: write
    uses: ThanhNguyxnOrg/.github/.github/workflows/publish-npm.yml@release-v1
    with:
      node_version: '24'
      node_version_file: ''
      cache: ''
      install_command: ''
      verify_command: npm run validate && npm run test:distribution -- --release
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
