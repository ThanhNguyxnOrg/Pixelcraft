name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/validate-skills.mjs
      - run: node scripts/build-adapters.mjs
      - name: Package skills and adapters
        run: |
          rm -rf release-package
          mkdir -p release-package
          cp -R skills release-package/skills
          cp -R dist release-package/adapters
          mkdir -p dist
          (cd release-package && zip -qr "$GITHUB_WORKSPACE/dist/pixelcraft-skills.zip" skills adapters)
          tar -czf dist/pixelcraft-skills.tar.gz -C release-package skills adapters
          ls -lh dist/pixelcraft-skills.zip dist/pixelcraft-skills.tar.gz
      - name: Attach release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" dist/pixelcraft-skills.zip dist/pixelcraft-skills.tar.gz --generate-notes
