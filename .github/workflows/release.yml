name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/validate-skills.mjs
      - run: node scripts/build-adapters.mjs
      - name: Package skills and adapters
        run: |
          rm -rf release-package
          mkdir -p release-package
          cp -R skills release-package/skills
          cp -R dist release-package/adapters
          mkdir -p dist
          (cd release-package && zip -qr "$GITHUB_WORKSPACE/dist/pixelcraft-skills.zip" skills adapters)
          tar -czf dist/pixelcraft-skills.tar.gz -C release-package skills adapters
          ls -lh dist/pixelcraft-skills.zip dist/pixelcraft-skills.tar.gz
      - name: Attach release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" dist/pixelcraft-skills.zip dist/pixelcraft-skills.tar.gz --generate-notes

  npm:
    needs: package
    if: github.repository == 'ThanhNguyxnOrg/Pixelcraft' && vars.PIXELCRAFT_NPM_APPROVED_TAG == github.ref_name
    permissions:
      contents: read
      id-token: write
    uses: ThanhNguyxnOrg/.github/.github/workflows/publish-npm.yml@release-v1
    with:
      node_version: '24'
      node_version_file: ''
      cache: ''
      install_command: ''
      verify_command: npm run validate && npm run test:distribution -- --release
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
